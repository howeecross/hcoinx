<!DOCTYPE html>
<html>
<head>
  <title>HOTDOT IDEX (Base)</title>
</head>
<body>

<h1>🔥 HOTDOT IDEX</h1>

<button onclick="connect()">Connect Wallet</button>

<h3>Swap Tokens</h3>

<input id="amount" placeholder="Amount">
<button onclick="swapAtoB()">Swap A → B</button>
<button onclick="swapBtoA()">Swap B → A</button>

<p id="status"></p>

<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<script>
let provider, signer, contract;

const CONTRACT = "YOUR_CONTRACT_ADDRESS";

const abi = [
  "function swapAtoB(uint)",
  "function swapBtoA(uint)"
];

async function connect(){
  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();
  contract = new ethers.Contract(CONTRACT, abi, signer);
  set("Connected");
}

async function swapAtoB(){
  const amt = document.getElementById("amount").value;
  await contract.swapAtoB(amt);
  set("Swapped A → B");
}

async function swapBtoA(){
  const amt = document.getElementById("amount").value;
  await contract.swapBtoA(amt);
  set("Swapped B → A");
}

function set(t){ document.getElementById("status").innerText = t; }
</script>

</body>
</html>
