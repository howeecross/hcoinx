<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HCOINX Slots - Play with Meme Coins</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #f0f0f0;
      text-align: center;
      padding: 20px;
    }
    #slot-machine {
      max-width: 400px;
      margin: auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px #ffaa00;
    }
    .reels {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }
    .reel {
      font-size: 2.5rem;
      padding: 20px;
      background: #333;
      border: 2px solid #ffaa00;
      border-radius: 5px;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #spin-button {
      background: #ffaa00;
      color: #000;
      font-size: 1.2rem;
      padding: 10px 30px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    #coin-selector, #wallet-address {
      margin: 15px 0;
    }
    select, input[type="text"] {
      padding: 10px;
      font-size: 1rem;
      width: 90%;
      max-width: 300px;
      margin-top: 5px;
    }
    #result, #message {
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div id="slot-machine">
    <h2>🎰 HCOINX SLOTS 🎰</h2>

    <div id="coin-selector">
      <label for="coin">Select Meme Coin:</label><br>
      <select id="coin">
        <option value="DOGE">Dogecoin (DOGE)</option>
        <option value="SHIB">Shiba Inu (SHIB)</option>
        <option value="PEPE">Pepe (PEPE)</option>
      </select>
    </div>

    <div id="wallet-address">
      <label for="wallet">Enter Wallet Address:</label><br>
      <input type="text" id="wallet" placeholder="Enter your wallet address here">
      <div id="message"></div>
    </div>

    <div class="reels">
      <div class="reel" id="reel1">🍒</div>
      <div class="reel" id="reel2">🍋</div>
      <div class="reel" id="reel3">🍇</div>
    </div>

    <button id="spin-button" disabled>Spin</button>
    <div id="result"></div>
  </div>

  <script>
    const symbols = ['🍒', '🍋', '🍇', '🍉', '🍍', '⭐', '💎'];

    function getRandomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function spinReels() {
      const reel1 = getRandomSymbol();
      const reel2 = getRandomSymbol();
      const reel3 = getRandomSymbol();

      document.getElementById("reel1").textContent = reel1;
      document.getElementById("reel2").textContent = reel2;
      document.getElementById("reel3").textContent = reel3;

      const result = document.getElementById("result");
      if (reel1 === reel2 && reel2 === reel3) {
        result.textContent = "🎉 You win!";
      } else {
        result.textContent = "Try again!";
      }
    }

    function validateAddress(address, coin) {
      const regexMap = {
        DOGE: /^D{1}[5-9A-HJ-NP-U]{1}[1-9A-HJ-NP-Za-km-z]{32}$/,
        SHIB: /^0x[a-fA-F0-9]{40}$/,
        PEPE: /^0x[a-fA-F0-9]{40}$/
      };
      return regexMap[coin].test(address);
    }

    const walletInput = document.getElementById("wallet");
    const coinSelect = document.getElementById("coin");
    const message = document.getElementById("message");
    const spinButton = document.getElementById("spin-button");

    walletInput.addEventListener("input", () => {
      const coin = coinSelect.value;
      const address = walletInput.value.trim();
      if (validateAddress(address, coin)) {
        message.textContent = '';
        spinButton.disabled = false;
      } else {
        message.textContent = 'Invalid wallet address for ' + coin;
        spinButton.disabled = true;
      }
    });

    spinButton.addEventListener("click", () => {
      // Optional: Send coin selection + address to backend
      spinReels();
    });
  </script>

</body>
</html>
